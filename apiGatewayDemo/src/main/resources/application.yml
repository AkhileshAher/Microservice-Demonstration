spring:
    application:
        name: ecom-api-gateway

    cloud:
        gateway:
            server:
                webflux:
                    routes:
#                         DYNAMIC ROUTING
                        - id: ecom-order-service
                          uri: lb://ecom-order-service
                          predicates:
                              - Path=/order/**
                        - id: ecom-inventory-service
                          uri: lb://ecom-inventory-service
                          predicates:
                              - Path=/inventory/**

#                         STATIC ROUTING
#                         - id: ecom-order-service
#                           uri: http://localhost:8080
#                           predicates:
#                               - Path=/order/**
#                         - id: ecom-order-service
#                           uri: http://localhost:8081
#                           predicates:
#                               - Path=/inventory/**

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka

server:
    port: 9091
