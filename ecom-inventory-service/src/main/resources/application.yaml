spring:
    application:
        name: ecom-inventory-service

    datasource:
        url: jdbc:mysql://localhost:3030/demodb
        username: user
        password: userpass

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true

server:
    port: 8089

eureka:
    client:
        register-with-eureka: true
        fetch-registry: true
        service-url:
            defaultZone: http://localhost:8761/eureka

